<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security & Hardening Controls -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://apis.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss: https://script.google.com https://script.googleusercontent.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.google-analytics.com https://*.analytics.google.com https://accounts.google.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self' https://script.google.com; frame-ancestors 'none';"
    />

    <!-- Google Identity Services client for zero-redirect authentication -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <title>STIC • SAREC Mirzapur | Technology &amp; Innovation Community (AKTU Code 1215)</title>

    <meta
      name="description"
      content="Official platform of STIC (Technology and Innovation Community) at Samrat Ashok Rajkiya Engineering College, Mirzapur (AKTU Code 1215). Explore 8 engineering guilds, peer mentorship, hackathons, and real-world student projects."
    />
    <meta
      name="keywords"
      content="STIC, SAREC Mirzapur, Samrat Ashok Rajkiya Engineering College, AKTU 1215, Technology and Innovation Community, Coding Club, AI Data Science, Web Development, Robotics, IoT, Hackathons, Smart India Hackathon, Student Projects"
    />
    <meta name="author" content="STIC SAREC Mirzapur" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STIC SAREC" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STIC SAREC Mirzapur" />
    <meta property="og:title" content="STIC • SAREC Mirzapur | Technology &amp; Innovation Community (AKTU Code 1215)" />
    <meta
      property="og:description"
      content="Code, Build, Innovate. The premier student technical community at Samrat Ashok Rajkiya Engineering College, Mirzapur with 8 specialized guilds, hands-on workshops, and collaborative projects."
    />
    <meta property="og:image" content="/assets/logos/stic-logo-light.png" />
    <meta property="og:image:alt" content="STIC SAREC Mirzapur Logo" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STIC • SAREC Mirzapur | Technology &amp; Innovation Community" />
    <meta
      name="twitter:description"
      content="Code, Build, Innovate. Official student technical community at Samrat Ashok Rajkiya Engineering College, Mirzapur (AKTU Code 1215)."
    />
    <meta name="twitter:image" content="/assets/logos/stic-logo-light.png" />

    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Initialization Script: Runs synchronously before body renders to eliminate white flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('stic_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (systemDark ? 'dark' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
