    <!-- Theme Initialization Script: Runs synchronously before body renders to eliminate white flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('stic_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (systemDark ? 'dark' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- Client-Side Cybersecurity Guard: Intercepts dangerous protocols, executable downloads, and reverse tabnabbing -->
    <script>
      (function () {
        var dangerousExts = /\.(apk|exe|bat|cmd|vbs|vbe|msi|msp|dmg|pkg|bin|iso|ps1|sh|bash|com|scr|pif|hta|jar|cpl|gadget)(\?.*)?$/i;
        var dangerousProtocols = /^(javascript:|vbscript:|data:text\/html)/i;

        // Intercept link clicks defensively
        document.addEventListener('click', function (e) {
          var target = e.target && e.target.closest ? e.target.closest('a') : null;
          if (!target) return;
          var href = target.getAttribute('href') || '';
          var trimmed = href.trim();

          // Block dangerous execution protocols
          if (dangerousProtocols.test(trimmed)) {
            e.preventDefault();
            e.stopPropagation();
            console.warn('[STIC Security Guard] Blocked dangerous protocol execution:', trimmed);
            return false;
          }

          // Block unauthorized executable payloads
          if (dangerousExts.test(trimmed)) {
            e.preventDefault();
            e.stopPropagation();
            console.warn('[STIC Security Guard] Blocked unauthorized executable download:', trimmed);
            return false;
          }

          // Enforce reverse tabnabbing defense (CWE-1022) on external new-tab targets
          if (target.getAttribute('target') === '_blank') {
            var rel = target.getAttribute('rel') || '';
            if (!rel.includes('noopener') || !rel.includes('noreferrer')) {
              target.setAttribute('rel', 'noopener noreferrer');
            }
          }
        }, true);

        // Intercept window.open
        if (typeof window !== 'undefined' && window.open) {
          var originalOpen = window.open;
          window.open = function (url) {
            if (typeof url === 'string') {
              var cleanUrl = url.trim();
              if (dangerousProtocols.test(cleanUrl) || dangerousExts.test(cleanUrl)) {
                console.warn('[STIC Security Guard] Blocked dangerous window.open target:', cleanUrl);
                return null;
              }
            }
            return originalOpen.apply(window, arguments);
          };
        }
      })();
    </script>
