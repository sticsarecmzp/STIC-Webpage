<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="128" height="128" rx="28" fill="#030712" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <circle cx="64" cy="64" r="50" fill="url(#meshGlow)" />

  <!-- Code Innovation Emblem (< /> + stylized S) -->
  <g filter="url(#glowFilter)">
    <!-- Left Bracket < -->
    <path d="M 44 42 L 28 64 L 44 86" fill="none" stroke="url(#accentGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Forward Slash / Innovation Core -->
    <path d="M 72 36 L 56 92" fill="none" stroke="url(#primaryGlow)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Right Bracket > -->
    <path d="M 84 42 L 100 64 L 84 86" fill="none" stroke="url(#primaryGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Pulse Status Dot -->
  <circle cx="64" cy="104" r="4.5" fill="#10b981" />
</svg>
